<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#0B5B4C">
<title>Attendance — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.att-row { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--color-border); gap:12px; }
.att-row:last-child { border-bottom:none; }
.att-student { display:flex; align-items:center; gap:10px; min-width:0; }
.att-student .name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att-student .idc { font-family: var(--font-mono); font-size:11.5px; color: var(--color-muted); }
.status-group { display:flex; gap:6px; flex-shrink:0; }
.status-chip {
  border: 1.4px solid var(--color-border);
  background: var(--color-surface);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  color: var(--color-ink-soft);
}
.status-chip[data-status="Present"].on { background:#E4F3E9; border-color:#2F7A4F; color:#2F7A4F; }
.status-chip[data-status="Absent"].on { background:#FBEAE5; border-color:#B3432B; color:#B3432B; }
.status-chip[data-status="Late"].on { background:#FBF1DC; border-color:#B8892B; color:#B8892B; }
.status-chip[data-status="Leave"].on { background:#E9E7F5; border-color:#5B4FA0; color:#5B4FA0; }
</style>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2 data-i18n="nav_attendance">হাজিরা</h2>
      </div>

      <div class="card card-pad" style="margin-bottom: var(--space-5);">
        <div class="grid-2">
          <div class="field">
            <label data-i18n="class_label">শ্রেণি</label>
            <select id="sel-class"></select>
          </div>
          <div class="field">
            <label data-i18n="section_label">শাখা</label>
            <select id="sel-section"></select>
          </div>
        </div>
        <div class="field" style="max-width: 220px;">
          <label>তারিখ / Date</label>
          <input type="date" id="sel-date">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btn-load-list">তালিকা লোড করুন / Load list</button>
          <button class="btn btn-ghost" id="btn-mark-all-present" hidden>সবাইকে উপস্থিত করুন / Mark all present</button>
        </div>
      </div>

      <div class="card" id="attendance-card" hidden>
        <div style="padding: var(--space-4) var(--space-5); border-bottom:1px solid var(--color-border); display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size:15px;" id="attendance-summary">—</h3>
          <button class="btn btn-primary" id="btn-save-attendance">সংরক্ষণ করুন / Save attendance</button>
        </div>
        <div id="attendance-list"></div>
      </div>

      <div id="attendance-empty" class="empty-state">
        <div class="glyph">&#10003;</div>
        <h3>শ্রেণি ও শাখা নির্বাচন করুন / Select a class and section</h3>
        <p>হাজিরা নিতে উপরে থেকে শ্রেণি, শাখা ও তারিখ বেছে "তালিকা লোড করুন" চাপুন।</p>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<script src="js/supabase-client.js?v=2"></script>
<script src="js/i18n.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/shell.js?v=2"></script>
<script>
let statuses = [];
let currentSession = null;
let currentStudents = []; // [{id, full_name, permanent_student_id, chosenStatusId}]
let myProfile = null;

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

async function loadStatuses() {
  const { data } = await supabaseClient.from('attendance_statuses').select('id, name').eq('is_active', true);
  statuses = data || [];
}

async function loadClasses() {
  let classIds = null;

  // Teachers only see classes they're assigned to; admin/founder sees all
  if (myProfile.role === 'teacher') {
    const { data: teacherRow } = await supabaseClient.from('teachers').select('id').eq('profile_id', myProfile.id).maybeSingle();
    if (teacherRow) {
      const { data: assignments } = await supabaseClient.from('teacher_assignments').select('class_id').eq('teacher_id', teacherRow.id);
      classIds = [...new Set((assignments || []).map(a => a.class_id))];
    } else {
      classIds = [];
    }
  }

  let query = supabaseClient.from('classes').select('id, name').eq('is_active', true).order('sort_order');
  if (classIds) query = query.in('id', classIds.length ? classIds : ['00000000-0000-0000-0000-000000000000']);
  const { data: classes } = await query;

  const sel = document.getElementById('sel-class');
  sel.innerHTML = (classes || []).map(c => `<option value="${c.id}">${c.name}</option>`).join('') || '<option value="">— কোনো শ্রেণি নেই / No classes —</option>';
  sel.addEventListener('change', loadSections);
  if (classes && classes.length) await loadSections();
}

async function loadSections() {
  const classId = document.getElementById('sel-class').value;
  const sel = document.getElementById('sel-section');
  if (!classId) { sel.innerHTML = ''; return; }
  const { data: sections } = await supabaseClient.from('sections').select('id, name').eq('class_id', classId).eq('is_active', true);
  sel.innerHTML = (sections || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('') || '<option value="">সব শাখা / All sections</option>';
}

async function loadStudentList() {
  const classId = document.getElementById('sel-class').value;
  const sectionId = document.getElementById('sel-section').value || null;
  const date = document.getElementById('sel-date').value || todayStr();
  if (!classId) { showToast('একটি শ্রেণি নির্বাচন করুন / Select a class', 'error'); return; }

  document.getElementById('attendance-empty').setAttribute('hidden', '');
  document.getElementById('attendance-card').removeAttribute('hidden');
  document.getElementById('attendance-list').innerHTML = '<div style="padding: var(--space-5);"><div class="skeleton" style="height:40px;"></div></div>';

  // Find students whose CURRENT academic_history row matches this class/section
  let query = supabaseClient
    .from('academic_history')
    .select('student_id, academic_roll, students(id, full_name, permanent_student_id, status)')
    .eq('class_id', classId);
  if (sectionId) query = query.eq('section_id', sectionId);
  if (currentSession) query = query.eq('academic_session_id', currentSession.id);

  const { data: histRows, error } = await query;
  if (error) { showToast(error.message, 'error'); return; }

  const students = (histRows || [])
    .filter(r => r.students && r.students.status === 'active')
    .map(r => ({ ...r.students, academic_roll: r.academic_roll }))
    // Sort by roll number (numeric-aware) so the attendance list matches the
    // classroom roll call order, not database insertion order.
    .sort((a, b) => {
      const rollA = parseInt(a.academic_roll, 10);
      const rollB = parseInt(b.academic_roll, 10);
      if (!isNaN(rollA) && !isNaN(rollB)) return rollA - rollB;
      if (!isNaN(rollA)) return -1;
      if (!isNaN(rollB)) return 1;
      return (a.academic_roll || '').localeCompare(b.academic_roll || '');
    });

  // Pull any attendance already recorded for this date so re-opening shows prior marks
  const studentIds = students.map(s => s.id);
  let existingMap = {};
  if (studentIds.length) {
    const { data: existing } = await supabaseClient
      .from('attendance')
      .select('student_id, status_id')
      .eq('attendance_date', date)
      .in('student_id', studentIds);
    (existing || []).forEach(e => { existingMap[e.student_id] = e.status_id; });
  }

  const presentStatus = statuses.find(s => s.name === 'Present');
  currentStudents = students.map(s => ({
    id: s.id,
    full_name: s.full_name,
    permanent_student_id: s.permanent_student_id,
    academic_roll: s.academic_roll,
    statusId: existingMap[s.id] || null
  }));

  renderAttendanceList();
  document.getElementById('btn-mark-all-present').removeAttribute('hidden');
  document.getElementById('attendance-summary').textContent =
    `${currentStudents.length} students — ${formatDate(date, getLang())}`;
}

function renderAttendanceList() {
  const list = document.getElementById('attendance-list');
  if (!currentStudents.length) {
    list.innerHTML = '<div class="empty-state"><div class="glyph">&#128101;</div><h3>এই শ্রেণি/শাখায় কোনো ছাত্র নেই</h3><p>No students found in this class/section for the current session.</p></div>';
    return;
  }
  list.innerHTML = currentStudents.map(s => `
    <div class="att-row" data-student="${s.id}">
      <div class="att-student">
        <div class="avatar">${s.academic_roll || initials(s.full_name)}</div>
        <div style="min-width:0;">
          <div class="name">${s.academic_roll ? `Roll ${s.academic_roll} — ` : ''}${s.full_name}</div>
          <div class="idc">${s.permanent_student_id}</div>
        </div>
      </div>
      <div class="status-group">
        ${statuses.map(st => `
          <button type="button" class="status-chip ${s.statusId === st.id ? 'on' : ''}" data-status="${st.name}" data-status-id="${st.id}" onclick="setStudentStatus('${s.id}', '${st.id}')">${st.name}</button>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function setStudentStatus(studentId, statusId) {
  const student = currentStudents.find(s => s.id === studentId);
  if (student) student.statusId = statusId;
  const row = document.querySelector(`.att-row[data-student="${studentId}"]`);
  row.querySelectorAll('.status-chip').forEach(chip => {
    chip.classList.toggle('on', chip.getAttribute('data-status-id') === statusId);
  });
}

document.getElementById('btn-mark-all-present').addEventListener('click', () => {
  const present = statuses.find(s => s.name === 'Present');
  if (!present) return;
  currentStudents.forEach(s => { s.statusId = present.id; });
  renderAttendanceList();
});

document.getElementById('btn-load-list').addEventListener('click', loadStudentList);

document.getElementById('btn-save-attendance').addEventListener('click', async () => {
  const date = document.getElementById('sel-date').value || todayStr();
  const classId = document.getElementById('sel-class').value;
  const sectionId = document.getElementById('sel-section').value || null;
  const toSave = currentStudents.filter(s => s.statusId);
  if (!toSave.length) { showToast('কোনো status নির্বাচন করা হয়নি / No statuses selected', 'error'); return; }

  const btn = document.getElementById('btn-save-attendance');
  setBtnLoading(btn, true);
  try {
    const rows = toSave.map(s => ({
      student_id: s.id,
      class_id: classId,
      section_id: sectionId,
      attendance_date: date,
      status_id: s.statusId,
      marked_by: myProfile.id
    }));
    const { error } = await supabaseClient.from('attendance').upsert(rows, { onConflict: 'student_id,attendance_date' });
    if (error) throw error;
    showToast('হাজিরা সংরক্ষিত হয়েছে / Attendance saved', 'success');
  } catch (err) {
    showToast(err.message || t('error_generic'), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
});

(async () => {
  myProfile = await renderShell('attendance');
  if (!myProfile) return;
  if (!['founder', 'admin', 'teacher'].includes(myProfile.role)) {
    document.querySelector('.content').innerHTML = '<div class="empty-state"><div class="glyph">&#128274;</div><h3>Access restricted</h3></div>';
    return;
  }

  document.getElementById('sel-date').value = todayStr();

  const { data: sessions } = await supabaseClient.from('academic_sessions').select('id, name, status').order('created_at', { ascending: false });
  currentSession = (sessions || []).find(s => s.status === 'active') || (sessions || [])[0] || null;

  await loadStatuses();
  await loadClasses();
})();
</script>
</body>
</html>
