<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#0B5B4C">
<title>Income & Expense — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.tabs { display:flex; gap:4px; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); overflow-x:auto; }
.tab-btn { padding: 10px 16px; border:none; background:none; font-size:13.5px; font-weight:600; color: var(--color-ink-soft); cursor:pointer; border-bottom: 2.5px solid transparent; white-space:nowrap; }
.tab-btn.active { color: var(--color-green-800); border-bottom-color: var(--color-green-800); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
.inline-form { display:flex; gap: var(--space-2); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--space-5); }
.inline-form .field { margin-bottom: 0; min-width: 140px; }
</style>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2>আয়-ব্যয় / Income & Expense</h2>
      </div>

      <div class="stat-grid" style="margin-bottom: var(--space-5);">
        <div class="stat-card"><div class="accent"></div><div class="n" id="stat-income">—</div><div class="l">মোট আয় (এই মাস) / Income (this month)</div></div>
        <div class="stat-card"><div class="accent"></div><div class="n" id="stat-expense">—</div><div class="l">মোট ব্যয় (এই মাস) / Expense (this month)</div></div>
        <div class="stat-card"><div class="accent"></div><div class="n" id="stat-balance">—</div><div class="l">ব্যালেন্স / Balance</div></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="income">আয় / Income</button>
        <button class="tab-btn" data-tab="expense">ব্যয় / Expense</button>
        <button class="tab-btn" data-tab="categories">ক্যাটাগরি / Categories</button>
      </div>

      <!-- ===== INCOME ===== -->
      <div class="tab-panel active" id="panel-income">
        <form id="form-income" class="inline-form">
          <div class="field">
            <label>ক্যাটাগরি / Category</label>
            <select id="i-category"></select>
          </div>
          <div class="field">
            <label>পরিমাণ / Amount</label>
            <input type="number" id="i-amount" min="0" step="0.01" required style="width:130px;">
          </div>
          <div class="field">
            <label>তারিখ / Date</label>
            <input type="date" id="i-date">
          </div>
          <div class="field" style="flex:1; min-width:180px;">
            <label>বিবরণ / Description</label>
            <input type="text" id="i-desc">
          </div>
          <button type="submit" class="btn btn-primary">+ যোগ করুন / Add</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Category</th><th>Amount</th><th>Description</th><th>Date</th></tr></thead>
            <tbody id="income-tbody"><tr><td colspan="4"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ===== EXPENSE ===== -->
      <div class="tab-panel" id="panel-expense">
        <form id="form-expense" class="inline-form">
          <div class="field">
            <label>ক্যাটাগরি / Category</label>
            <select id="e-category"></select>
          </div>
          <div class="field">
            <label>পরিমাণ / Amount</label>
            <input type="number" id="e-amount" min="0" step="0.01" required style="width:130px;">
          </div>
          <div class="field">
            <label>তারিখ / Date</label>
            <input type="date" id="e-date">
          </div>
          <div class="field" style="flex:1; min-width:180px;">
            <label>বিবরণ / Description</label>
            <input type="text" id="e-desc">
          </div>
          <button type="submit" class="btn btn-primary">+ যোগ করুন / Add</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Category</th><th>Amount</th><th>Description</th><th>Date</th></tr></thead>
            <tbody id="expense-tbody"><tr><td colspan="4"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ===== CATEGORIES ===== -->
      <div class="tab-panel" id="panel-categories">
        <div class="grid-2" style="align-items:start;">
          <div>
            <h3 style="font-size:14.5px; margin-bottom: var(--space-3);">আয়ের ক্যাটাগরি / Income categories</h3>
            <form id="form-income-cat" class="inline-form">
              <div class="field" style="flex:1;">
                <input type="text" id="ic-name" placeholder="e.g. Donation" required>
              </div>
              <button type="submit" class="btn btn-ghost">+ Add</button>
            </form>
            <div class="table-wrap">
              <table>
                <tbody id="income-cat-tbody"></tbody>
              </table>
            </div>
          </div>
          <div>
            <h3 style="font-size:14.5px; margin-bottom: var(--space-3);">ব্যয়ের ক্যাটাগরি / Expense categories</h3>
            <form id="form-expense-cat" class="inline-form">
              <div class="field" style="flex:1;">
                <input type="text" id="ec-name" placeholder="e.g. Electricity" required>
              </div>
              <button type="submit" class="btn btn-ghost">+ Add</button>
            </form>
            <div class="table-wrap">
              <table>
                <tbody id="expense-cat-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/pwa.js?v=2"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
let incomeCatCache = [];
let expenseCatCache = [];

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function monthRange() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().slice(0, 10);
  return { start, end };
}

async function loadCategories() {
  const [{ data: inc }, { data: exp }] = await Promise.all([
    supabaseClient.from('income_categories').select('id, name, is_active').order('name'),
    supabaseClient.from('expense_categories').select('id, name, is_active').order('name'),
  ]);
  incomeCatCache = inc || [];
  expenseCatCache = exp || [];

  document.getElementById('i-category').innerHTML = incomeCatCache.filter(c => c.is_active).map(c => `<option value="${c.id}">${c.name}</option>`).join('') || '<option value="">— No categories —</option>';
  document.getElementById('e-category').innerHTML = expenseCatCache.filter(c => c.is_active).map(c => `<option value="${c.id}">${c.name}</option>`).join('') || '<option value="">— No categories —</option>';

  renderCatTable('income-cat-tbody', incomeCatCache, 'income_categories');
  renderCatTable('expense-cat-tbody', expenseCatCache, 'expense_categories');
}

function renderCatTable(tbodyId, cache, table) {
  const tbody = document.getElementById(tbodyId);
  if (!cache.length) { tbody.innerHTML = '<tr><td class="hint">কোনো ক্যাটাগরি নেই / None yet</td></tr>'; return; }
  tbody.innerHTML = cache.map(c => `
    <tr>
      <td>${c.name}</td>
      <td><span class="pill pill-${c.is_active ? 'active' : 'inactive'}">${c.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><button class="btn btn-ghost" style="padding:4px 9px;font-size:11.5px;" onclick="toggleCategory('${table}','${c.id}', ${c.is_active})">${c.is_active ? 'Deactivate' : 'Activate'}</button></td>
    </tr>
  `).join('');
}

async function toggleCategory(table, id, isActive) {
  const { error } = await supabaseClient.from(table).update({ is_active: !isActive }).eq('id', id);
  if (error) { showToast(error.message, 'error'); return; }
  await loadCategories();
}

document.getElementById('form-income-cat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('ic-name').value.trim();
  if (!name) return;
  const { error } = await supabaseClient.from('income_categories').insert({ name });
  if (error) { showToast(error.message, 'error'); return; }
  document.getElementById('ic-name').value = '';
  showToast('যোগ করা হয়েছে / Added', 'success');
  await loadCategories();
});

document.getElementById('form-expense-cat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('ec-name').value.trim();
  if (!name) return;
  const { error } = await supabaseClient.from('expense_categories').insert({ name });
  if (error) { showToast(error.message, 'error'); return; }
  document.getElementById('ec-name').value = '';
  showToast('যোগ করা হয়েছে / Added', 'success');
  await loadCategories();
});

// ---- Income records ----
document.getElementById('form-income').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    category_id: document.getElementById('i-category').value,
    amount: parseFloat(document.getElementById('i-amount').value),
    record_date: document.getElementById('i-date').value || new Date().toISOString().slice(0, 10),
    description: document.getElementById('i-desc').value.trim() || null,
  };
  if (!payload.category_id || isNaN(payload.amount)) { showToast('ক্যাটাগরি ও পরিমাণ দিন / Provide category and amount', 'error'); return; }
  const { error } = await supabaseClient.from('income_records').insert(payload);
  if (error) { showToast(error.message, 'error'); return; }
  document.getElementById('form-income').reset();
  showToast('আয় যোগ করা হয়েছে / Income added', 'success');
  await loadIncome();
  await loadStats();
});

async function loadIncome() {
  const { data, error } = await supabaseClient
    .from('income_records')
    .select('id, amount, description, record_date, income_categories(name)')
    .order('record_date', { ascending: false })
    .limit(20);
  const tbody = document.getElementById('income-tbody');
  if (error) { tbody.innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`; return; }
  if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="4" class="hint">এখনও কোনো আয় নেই / No income yet</td></tr>'; return; }
  tbody.innerHTML = data.map(r => `
    <tr><td>${r.income_categories?.name || '—'}</td><td>৳${Number(r.amount).toLocaleString()}</td><td>${r.description || '—'}</td><td>${formatDate(r.record_date, getLang())}</td></tr>
  `).join('');
}

// ---- Expense records ----
document.getElementById('form-expense').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    category_id: document.getElementById('e-category').value,
    amount: parseFloat(document.getElementById('e-amount').value),
    record_date: document.getElementById('e-date').value || new Date().toISOString().slice(0, 10),
    description: document.getElementById('e-desc').value.trim() || null,
  };
  if (!payload.category_id || isNaN(payload.amount)) { showToast('ক্যাটাগরি ও পরিমাণ দিন / Provide category and amount', 'error'); return; }
  const { error } = await supabaseClient.from('expenses').insert(payload);
  if (error) { showToast(error.message, 'error'); return; }
  document.getElementById('form-expense').reset();
  showToast('ব্যয় যোগ করা হয়েছে / Expense added', 'success');
  await loadExpense();
  await loadStats();
});

async function loadExpense() {
  const { data, error } = await supabaseClient
    .from('expenses')
    .select('id, amount, description, record_date, expense_categories(name)')
    .order('record_date', { ascending: false })
    .limit(20);
  const tbody = document.getElementById('expense-tbody');
  if (error) { tbody.innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`; return; }
  if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="4" class="hint">এখনও কোনো ব্যয় নেই / No expenses yet</td></tr>'; return; }
  tbody.innerHTML = data.map(r => `
    <tr><td>${r.expense_categories?.name || '—'}</td><td>৳${Number(r.amount).toLocaleString()}</td><td>${r.description || '—'}</td><td>${formatDate(r.record_date, getLang())}</td></tr>
  `).join('');
}

// ---- Stats ----
async function loadStats() {
  const { start, end } = monthRange();
  const [{ data: inc }, { data: exp }] = await Promise.all([
    supabaseClient.from('income_records').select('amount').gte('record_date', start).lte('record_date', end),
    supabaseClient.from('expenses').select('amount').gte('record_date', start).lte('record_date', end),
  ]);
  const totalIncome = (inc || []).reduce((s, r) => s + Number(r.amount), 0);
  const totalExpense = (exp || []).reduce((s, r) => s + Number(r.amount), 0);
  document.getElementById('stat-income').textContent = '৳' + totalIncome.toLocaleString();
  document.getElementById('stat-expense').textContent = '৳' + totalExpense.toLocaleString();
  document.getElementById('stat-balance').textContent = '৳' + (totalIncome - totalExpense).toLocaleString();
}

(async () => {
  const profile = await renderShell('finance');
  if (!profile) return;
  if (!['founder', 'admin'].includes(profile.role)) {
    document.querySelector('.content').innerHTML = '<div class="empty-state"><div class="glyph">&#128274;</div><h3>Access restricted</h3><p>এই পাতা শুধু admin/founder দেখতে পারবেন।</p></div>';
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('i-date').value = today;
  document.getElementById('e-date').value = today;

  await loadCategories();
  await loadIncome();
  await loadExpense();
  await loadStats();
})();
</script>
</body>
</html>
