<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Committee — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.tabs { display:flex; gap:4px; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); overflow-x:auto; }
.tab-btn { padding: 10px 16px; border:none; background:none; font-size:13.5px; font-weight:600; color: var(--color-ink-soft); cursor:pointer; border-bottom: 2.5px solid transparent; white-space:nowrap; }
.tab-btn.active { color: var(--color-green-800); border-bottom-color: var(--color-green-800); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
.inline-form { display:flex; gap: var(--space-2); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--space-5); }
.inline-form .field { margin-bottom: 0; min-width: 140px; }
.member-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--space-4); }
.member-card { border:1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); background: var(--color-surface); text-align:center; }
.member-card .avatar-lg { width:56px; height:56px; border-radius:50%; margin:0 auto var(--space-3); background: var(--color-green-100); color: var(--color-green-800); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
.member-card .position { color: var(--color-gold-600); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }
.member-card .contact { font-size:12.5px; color: var(--color-ink-soft); margin-top:8px; }
</style>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2 data-i18n="nav_committee">কমিটি</h2>
        <button class="btn btn-primary" id="btn-new-member" hidden>+ নতুন সদস্য / New member</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="members">সদস্যবৃন্দ / Members</button>
        <button class="tab-btn" data-tab="positions" id="tab-positions-btn" hidden>পদবি / Positions</button>
      </div>

      <div class="tab-panel active" id="panel-members">
        <div class="member-grid" id="members-grid">
          <div class="skeleton" style="height:150px;"></div>
        </div>
        <div id="members-empty" class="empty-state" hidden>
          <div class="glyph">&#127970;</div>
          <h3>এখনও কোনো কমিটি সদস্য নেই / No committee members yet</h3>
        </div>
      </div>

      <div class="tab-panel" id="panel-positions">
        <form id="form-position" class="inline-form">
          <div class="field"><input type="text" id="pos-name" placeholder="e.g. Chairman" required style="width:220px;"></div>
          <button type="submit" class="btn btn-primary">+ যোগ করুন / Add</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th data-i18n="status">Status</th><th></th></tr></thead>
            <tbody id="positions-tbody"><tr><td colspan="3"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<!-- New / Edit member modal -->
<div class="modal-backdrop" id="modal-member" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="member-modal-title">নতুন সদস্য / New member</h3>
      <button class="modal-close" onclick="closeModal('modal-member')">&times;</button>
    </div>
    <form id="form-member" class="stack">
      <input type="hidden" id="m-id">
      <div class="field">
        <label data-i18n="full_name">পূর্ণ নাম</label>
        <input type="text" id="m-name" required>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>পদবি / Position</label>
          <select id="m-position"></select>
        </div>
        <div class="field">
          <label>যোগদানের তারিখ / Joining date</label>
          <input type="date" id="m-joining">
        </div>
      </div>
      <div class="field">
        <label>যোগাযোগ / Contact</label>
        <input type="text" id="m-contact" placeholder="Phone / Email">
      </div>
      <div class="field">
        <label data-i18n="status">অবস্থা</label>
        <select id="m-status">
          <option value="active">সক্রিয় / Active</option>
          <option value="inactive">নিষ্ক্রিয় / Inactive</option>
        </select>
      </div>
      <div class="row" style="justify-content:flex-end; margin-top: var(--space-2);">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-member')" data-i18n="cancel">বাতিল</button>
        <button type="submit" class="btn btn-primary" id="btn-save-member"><span data-i18n="save">সংরক্ষণ করুন</span></button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
let positionsCache = [];
let membersCache = [];
let canManage = false;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

async function loadPositions() {
  const { data, error } = await supabaseClient.from('committee_positions').select('id, name, is_active').order('name');
  if (error) { showToast(error.message, 'error'); return; }
  positionsCache = data || [];
  document.getElementById('m-position').innerHTML = positionsCache.filter(p => p.is_active).map(p => `<option value="${p.id}">${p.name}</option>`).join('') || '<option value="">— No positions —</option>';
  renderPositionsTable();
}

function renderPositionsTable() {
  const tbody = document.getElementById('positions-tbody');
  if (!positionsCache.length) { tbody.innerHTML = '<tr><td colspan="3" class="hint">কোনো পদবি নেই / None yet</td></tr>'; return; }
  tbody.innerHTML = positionsCache.map(p => `
    <tr>
      <td>${p.name}</td>
      <td><span class="pill pill-${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><button class="btn btn-ghost" style="padding:5px 10px;font-size:12px;" onclick="togglePosition('${p.id}', ${p.is_active})">${p.is_active ? 'Deactivate' : 'Activate'}</button></td>
    </tr>
  `).join('');
}

async function togglePosition(id, isActive) {
  const { error } = await supabaseClient.from('committee_positions').update({ is_active: !isActive }).eq('id', id);
  if (error) { showToast(error.message, 'error'); return; }
  await loadPositions();
}

document.getElementById('form-position').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('pos-name').value.trim();
  if (!name) return;
  const { error } = await supabaseClient.from('committee_positions').insert({ name });
  if (error) { showToast(error.message, 'error'); return; }
  document.getElementById('pos-name').value = '';
  showToast('যোগ করা হয়েছে / Added', 'success');
  await loadPositions();
});

async function loadMembers() {
  const { data, error } = await supabaseClient
    .from('committee_members')
    .select('id, full_name, contact, joining_date, status, committee_positions(name)')
    .order('created_at', { ascending: false });
  if (error) { showToast(error.message, 'error'); return; }
  membersCache = data || [];
  renderMembers();
}

function renderMembers() {
  const grid = document.getElementById('members-grid');
  const empty = document.getElementById('members-empty');
  const visible = membersCache.filter(m => canManage || m.status === 'active');
  if (!visible.length) { grid.innerHTML = ''; empty.removeAttribute('hidden'); return; }
  empty.setAttribute('hidden', '');
  grid.innerHTML = visible.map(m => `
    <div class="member-card">
      <div class="avatar-lg">${initials(m.full_name)}</div>
      <div style="font-weight:700; font-size:14.5px;">${m.full_name}</div>
      <div class="position">${m.committee_positions?.name || '—'}</div>
      ${m.contact ? `<div class="contact">${m.contact}</div>` : ''}
      ${canManage ? `
        <div class="row" style="justify-content:center; margin-top: var(--space-3); gap:6px;">
          <span class="pill pill-${m.status === 'active' ? 'active' : 'inactive'}">${m.status === 'active' ? 'Active' : 'Inactive'}</span>
          <button class="btn btn-ghost" style="padding:4px 9px; font-size:11.5px;" onclick="editMember('${m.id}')">Edit</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function editMember(id) {
  const m = membersCache.find(x => x.id === id);
  if (!m) return;
  document.getElementById('m-id').value = m.id;
  document.getElementById('m-name').value = m.full_name;
  document.getElementById('m-contact').value = m.contact || '';
  document.getElementById('m-joining').value = m.joining_date || '';
  document.getElementById('m-status').value = m.status;
  const posMatch = positionsCache.find(p => p.name === m.committee_positions?.name);
  if (posMatch) document.getElementById('m-position').value = posMatch.id;
  document.getElementById('member-modal-title').textContent = 'সদস্য সম্পাদনা / Edit member';
  openModal('modal-member');
}

document.getElementById('btn-new-member').addEventListener('click', () => {
  document.getElementById('form-member').reset();
  document.getElementById('m-id').value = '';
  document.getElementById('member-modal-title').textContent = 'নতুন সদস্য / New member';
  openModal('modal-member');
});

document.getElementById('form-member').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-save-member');
  setBtnLoading(btn, true);
  try {
    const id = document.getElementById('m-id').value;
    const payload = {
      full_name: document.getElementById('m-name').value.trim(),
      position_id: document.getElementById('m-position').value || null,
      joining_date: document.getElementById('m-joining').value || null,
      contact: document.getElementById('m-contact').value.trim() || null,
      status: document.getElementById('m-status').value,
    };
    let error;
    if (id) {
      ({ error } = await supabaseClient.from('committee_members').update(payload).eq('id', id));
    } else {
      ({ error } = await supabaseClient.from('committee_members').insert(payload));
    }
    if (error) throw error;
    showToast(id ? 'হালনাগাদ হয়েছে / Updated' : 'যোগ করা হয়েছে / Added', 'success');
    closeModal('modal-member');
    await loadMembers();
  } catch (err) {
    showToast(err.message || t('error_generic'), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
});

(async () => {
  const profile = await renderShell('committee');
  if (!profile) return;
  canManage = ['founder', 'admin'].includes(profile.role);
  if (canManage) {
    document.getElementById('btn-new-member').removeAttribute('hidden');
    document.getElementById('tab-positions-btn').removeAttribute('hidden');
  }
  await loadPositions();
  await loadMembers();
})();
</script>
</body>
</html>
