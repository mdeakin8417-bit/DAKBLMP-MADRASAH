<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#0B5B4C">
<title>ID Card — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.card-stage { display: flex; gap: var(--space-6); flex-wrap: wrap; justify-content: center; padding: var(--space-6) 0; }
.id-card { width: 337px; height: 530px; border-radius: 16px; overflow: hidden; position: relative; box-shadow: var(--shadow-pop); font-family: var(--font-body-en); background: #fff; }
.id-card.back { width: 337px; height: 220px; }

.id-header { background: linear-gradient(150deg, var(--color-green-900), var(--color-green-700)); color: #fff; padding: 14px 14px 10px; text-align:center; position:relative; }
.id-header::before { content:""; position:absolute; inset:0; background-image: radial-gradient(circle at 8px 8px, rgba(201,162,39,0.16) 1.4px, transparent 1.5px); background-size:16px 16px; }
.id-header .mark { width:44px; height:44px; border-radius:12px; margin:0 auto 6px; background: linear-gradient(155deg, var(--color-gold-400), var(--color-gold-600)); display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:700; font-size:16px; color: var(--color-green-900); position:relative; }
.id-header .org-name { font-family: var(--font-display); font-size: 15px; font-weight:700; position:relative; line-height:1.25; }
.id-header .org-addr { font-size: 9.5px; color: var(--color-gold-100); position:relative; margin-top:2px; }

.id-title-bar { background: var(--color-green-800); color:#fff; text-align:center; padding:5px; font-family: var(--font-display); font-size:14px; letter-spacing:0.06em; }

.id-photo-wrap { display:flex; justify-content:center; margin-top: 14px; }
.id-photo-box { width:100px; height:118px; border-radius:8px; overflow:hidden; border:2px solid var(--color-gold-400); background: var(--color-green-50); display:flex; align-items:center; justify-content:center; }
.id-photo-box img { width:100%; height:100%; object-fit:cover; }
.id-photo-box .initials { font-family: var(--font-display); font-size:32px; color: var(--color-green-700); }

.id-sid { text-align:center; font-family: var(--font-mono); font-weight:700; font-size:13px; color: var(--color-green-800); margin-top:8px; }

.id-info { padding: 12px 18px 0; }
.id-row { display:flex; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dotted var(--color-border); }
.id-row .k { width: 76px; flex-shrink:0; color: var(--color-ink-soft); font-weight:600; }
.id-row .sep { width:10px; color: var(--color-muted); }
.id-row .v { flex:1; font-weight:600; color: var(--color-ink); }

.id-sign { position:absolute; bottom: 14px; right: 18px; text-align:center; }
.id-sign .line { border-top:1px solid var(--color-ink-soft); width:110px; margin-bottom:3px; }
.id-sign .label { font-size:9.5px; color: var(--color-ink-soft); }

.id-card.back { padding: 16px; }
.id-back-qr { text-align:center; margin: 6px 0 10px; }
.id-back-text { font-size: 9px; color: var(--color-ink-soft); line-height:1.5; text-align:center; }
.id-back-org { font-family: var(--font-display); font-size:12.5px; color: var(--color-green-900); text-align:center; margin-bottom:6px; }

@media print {
  .app-shell > *:not(.main), .topbar, .bottom-nav, .section-head, .card-search-wrap { display: none !important; }
  .content { padding: 0 !important; }
  .card-stage { padding: 0; }
  .id-card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}
</style>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2>আইডি কার্ড / ID Card</h2>
      </div>

      <div class="card card-pad card-search-wrap" style="margin-bottom: var(--space-5); max-width: 460px;">
        <div class="field">
          <label>ছাত্র খুঁজুন / Search student</label>
          <input type="text" id="id-student-search" placeholder="নাম বা আইডি লিখুন... / Type name or ID">
          <div id="id-student-results" class="card" style="margin-top:4px; max-height:180px; overflow-y:auto; display:none;"></div>
        </div>
        <button class="btn btn-primary" id="btn-print-card" disabled>🖨️ প্রিন্ট করুন / Print card</button>
      </div>

      <div id="card-preview-wrap">
        <div class="empty-state">
          <div class="glyph">&#128100;</div>
          <h3>একজন ছাত্র নির্বাচন করুন / Select a student</h3>
          <p>উপরে সার্চ করে একজন ছাত্র বাছাই করলে তার আইডি কার্ড এখানে প্রিভিউ হবে।</p>
        </div>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<script src="js/supabase-client.js?v=2"></script>
<script src="js/pwa.js?v=2"></script>
<script src="js/i18n.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/shell.js?v=2"></script>
<script>
let orgInfo = { name: 'DAKBLMP MADRASAH', address: '' };
let searchTimeout;

async function loadOrgInfo() {
  const { data } = await supabaseClient.from('settings').select('value').eq('key', 'madrasah_general').maybeSingle();
  if (data?.value?.name) orgInfo.name = data.value.name;
  if (data?.value?.address) orgInfo.address = data.value.address;
}

document.getElementById('id-student-search').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('id-student-results').style.display = 'none'; return; }
  searchTimeout = setTimeout(async () => {
    const { data } = await supabaseClient
      .from('students')
      .select('id, full_name, permanent_student_id')
      .or(`full_name.ilike.%${q}%,permanent_student_id.ilike.%${q}%`)
      .eq('status', 'active')
      .limit(8);
    const box = document.getElementById('id-student-results');
    if (!data || !data.length) { box.style.display = 'none'; return; }
    box.innerHTML = data.map(s => `
      <div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--color-border); font-size:13.5px;" onclick="loadCard('${s.id}')">
        <strong>${s.full_name}</strong> <span class="hint">${s.permanent_student_id}</span>
      </div>
    `).join('');
    box.style.display = 'block';
  }, 250);
});

function initialsOf(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function row(label, value) {
  if (!value) return '';
  return `<div class="id-row"><span class="k">${label}</span><span class="sep">:</span><span class="v">${value}</span></div>`;
}

async function loadCard(studentId) {
  document.getElementById('id-student-results').style.display = 'none';

  const { data: student } = await supabaseClient.from('students').select('*').eq('id', studentId).single();
  const { data: hist } = await supabaseClient
    .from('academic_history')
    .select('academic_roll, classes(name, departments(name)), sections(name), academic_sessions(name, status)')
    .eq('student_id', studentId);
  const current = (hist || []).find(h => h.academic_sessions?.status === 'active') || (hist || [])[0];

  document.getElementById('id-student-search').value = `${student.full_name} (${student.permanent_student_id})`;
  document.getElementById('btn-print-card').disabled = false;

  const className = current?.classes?.name || '';
  const groupName = current?.classes?.departments?.name || '';
  const sectionName = current?.sections?.name || '';
  const sessionName = current?.academic_sessions?.name || '';
  const roll = current?.academic_roll || '';
  const bloodGroup = student.blood_group || '';

  const photoHtml = student.photo_url
    ? `<img src="${student.photo_url}" alt="${student.full_name}">`
    : `<span class="initials">${initialsOf(student.full_name)}</span>`;

  document.getElementById('card-preview-wrap').innerHTML = `
    <div class="card-stage">
      <div class="id-card front">
        <div class="id-header">
          <div class="mark">DM</div>
          <div class="org-name">${orgInfo.name}</div>
          ${orgInfo.address ? `<div class="org-addr">${orgInfo.address}</div>` : ''}
        </div>
        <div class="id-title-bar">ID CARD</div>
        <div class="id-photo-wrap">
          <div class="id-photo-box">${photoHtml}</div>
        </div>
        <div class="id-sid">SID: ${student.permanent_student_id}</div>
        <div class="id-info">
          ${row('Name', student.full_name)}
          ${row('Class', className)}
          ${row('Group', groupName)}
          ${row('Roll', roll)}
          ${row('Section', sectionName)}
          ${row('Session', sessionName)}
          ${row('BG', bloodGroup)}
        </div>
        <div class="id-sign">
          <div class="line"></div>
          <div class="label">Sign of Principal</div>
        </div>
      </div>

      <div class="id-card back">
        <div class="id-back-org">${orgInfo.name}</div>
        <div class="id-back-qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${student.permanent_student_id}" alt="QR Code" style="width:76px; height:76px;">
        </div>
        <div class="id-back-text">
          ${orgInfo.address ? orgInfo.address + '<br>' : ''}
          This card is the property of ${orgInfo.name}.<br>
          If found, please return to the madrasah office.<br>
          এই কার্ডটি হারিয়ে গেলে অনুগ্রহ করে মাদ্রাসা অফিসে ফেরত দিন।
        </div>
      </div>
    </div>
  `;
}

document.getElementById('btn-print-card').addEventListener('click', () => window.print());

(async () => {
  const profile = await renderShell('idcard');
  if (!profile) return;
  if (!['founder', 'admin'].includes(profile.role)) {
    document.querySelector('.content').innerHTML = '<div class="empty-state"><div class="glyph">&#128274;</div><h3>Access restricted</h3><p>এই পাতা শুধু admin/founder দেখতে পারবেন।</p></div>';
    return;
  }
  await loadOrgInfo();
})();
</script>
</body>
</html>
