<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Students — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2 data-i18n="students_title">ছাত্রছাত্রী</h2>
        <div class="row">
          <div class="search-bar">
            <input type="text" id="search-input" data-i18n-ph="search_students" placeholder="নাম, আইডি, রোল দিয়ে খুঁজুন...">
          </div>
          <button class="btn btn-primary" id="btn-new-student">
            <span>+</span> <span data-i18n="new_student">নতুন ছাত্র</span>
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="permanent_id">স্থায়ী আইডি</th>
              <th data-i18n="name">নাম</th>
              <th data-i18n="guardian_contact">অভিভাবকের যোগাযোগ</th>
              <th data-i18n="status">অবস্থা</th>
              <th>অভিভাবক / Guardian</th>
            </tr>
          </thead>
          <tbody id="students-tbody">
            <tr><td colspan="5"><div class="skeleton" style="height:18px;"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="students-empty" class="empty-state" hidden>
        <div class="glyph">&#128101;</div>
        <h3 data-i18n="no_students_title">এখনও কোনো ছাত্র নেই</h3>
        <p data-i18n="no_students_sub">শুরু করতে প্রথম ছাত্র যোগ করুন।</p>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<!-- New student modal -->
<div class="modal-backdrop" id="modal-new-student" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="new_student">নতুন ছাত্র</h3>
      <button class="modal-close" onclick="closeModal('modal-new-student')">&times;</button>
    </div>
    <form id="form-new-student" class="stack">
      <div class="field">
        <label data-i18n="full_name">পূর্ণ নাম</label>
        <input type="text" id="f-name" required>
      </div>
      <div class="field">
        <label data-i18n="permanent_id">স্থায়ী আইডি</label>
        <input type="text" id="f-permanent-id" placeholder="e.g. 20222076">
        <span class="hint" data-i18n="student_id_auto_hint">ভর্তির বছর থেকে স্বয়ংক্রিয়ভাবে তৈরি করতে খালি রাখুন</span>
      </div>
      <div class="grid-2">
        <div class="field">
          <label data-i18n="class_label">শ্রেণি</label>
          <select id="f-class"></select>
        </div>
        <div class="field">
          <label data-i18n="section_label">শাখা</label>
          <select id="f-section"></select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label data-i18n="date_of_birth">জন্ম তারিখ</label>
          <input type="date" id="f-dob">
        </div>
        <div class="field">
          <label data-i18n="gender">লিঙ্গ</label>
          <select id="f-gender">
            <option value="male" data-i18n="male">পুরুষ</option>
            <option value="female" data-i18n="female">মহিলা</option>
            <option value="other" data-i18n="other">অন্যান্য</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label data-i18n="guardian_contact">অভিভাবকের যোগাযোগ</label>
        <input type="text" id="f-guardian-contact">
      </div>
      <div class="field">
        <label data-i18n="address">ঠিকানা</label>
        <textarea id="f-address" rows="2"></textarea>
      </div>
      <div class="row" style="justify-content:flex-end; margin-top: var(--space-2);">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-new-student')" data-i18n="cancel">বাতিল</button>
        <button type="submit" class="btn btn-primary" id="btn-save-student"><span data-i18n="save">সংরক্ষণ করুন</span></button>
      </div>
    </form>
  </div>
</div>

<!-- Link guardian modal -->
<div class="modal-backdrop" id="modal-link-guardian" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>অভিভাবক লিংক করুন / Link guardian</h3>
      <button class="modal-close" onclick="closeModal('modal-link-guardian')">&times;</button>
    </div>
    <p class="hint" id="lg-student-name" style="margin-bottom: var(--space-4);"></p>
    <div class="field">
      <label>অভিভাবক খুঁজুন (নাম) / Search guardian by name</label>
      <input type="text" id="lg-search">
      <div id="lg-results" class="card" style="margin-top:4px; max-height:180px; overflow-y:auto; display:none;"></div>
    </div>
    <div class="field">
      <label>সম্পর্ক / Relationship</label>
      <input type="text" id="lg-relationship" placeholder="e.g. Father">
    </div>
    <div id="lg-linked-list" class="stack" style="margin-top: var(--space-4); border-top:1px solid var(--color-border); padding-top: var(--space-4);"></div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
let allStudents = [];
let currentSession = null;

async function loadFormLookups() {
  const [{ data: classes }, { data: sessions }] = await Promise.all([
    supabaseClient.from('classes').select('id, name').eq('is_active', true).order('sort_order'),
    supabaseClient.from('academic_sessions').select('id, name, status').order('created_at', { ascending: false }),
  ]);

  const classSelect = document.getElementById('f-class');
  classSelect.innerHTML = (classes || []).map(c => `<option value="${c.id}">${c.name}</option>`).join('')
    || '<option value="">— কোনো ক্লাস নেই / No classes yet —</option>';

  classSelect.addEventListener('change', loadSections);
  if (classes && classes.length) await loadSections();

  currentSession = (sessions || []).find(s => s.status === 'active') || (sessions || [])[0] || null;
}

async function loadSections() {
  const classId = document.getElementById('f-class').value;
  const sectionSelect = document.getElementById('f-section');
  if (!classId) { sectionSelect.innerHTML = ''; return; }
  const { data: sections } = await supabaseClient.from('sections').select('id, name').eq('class_id', classId).eq('is_active', true);
  sectionSelect.innerHTML = (sections || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('')
    || '<option value="">— কোনো শাখা নেই / No sections —</option>';
}

function renderStudentsTable(students) {
  const tbody = document.getElementById('students-tbody');
  const emptyState = document.getElementById('students-empty');
  if (!students.length) {
    tbody.innerHTML = '';
    emptyState.removeAttribute('hidden');
    return;
  }
  emptyState.setAttribute('hidden', '');
  tbody.innerHTML = students.map(s => `
    <tr>
      <td>
        <span class="id-badge" style="padding:4px 10px 4px 4px;">
          <span class="id-photo">${initials(s.full_name)}</span>
          <span class="id-code">${s.permanent_student_id}</span>
        </span>
      </td>
      <td>${s.full_name}</td>
      <td>${s.guardian_contact || '—'}</td>
      <td><span class="pill pill-${s.status === 'active' ? 'active' : 'inactive'}">${t(s.status) || s.status}</span></td>
      <td><button class="btn btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="openLinkGuardian('${s.id}', '${s.full_name.replace(/'/g,"\\'")}')">Manage</button></td>
    </tr>
  `).join('');
}

async function loadStudents() {
  const { data, error } = await supabaseClient
    .from('students')
    .select('id, permanent_student_id, full_name, guardian_contact, status')
    .order('created_at', { ascending: false });
  if (error) {
    showToast(error.message, 'error');
    return;
  }
  allStudents = data || [];
  renderStudentsTable(allStudents);
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderStudentsTable(allStudents); return; }
  renderStudentsTable(allStudents.filter(s =>
    s.full_name.toLowerCase().includes(q) || s.permanent_student_id.toLowerCase().includes(q)
  ));
});

document.getElementById('btn-new-student').addEventListener('click', () => openModal('modal-new-student'));

document.getElementById('form-new-student').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-save-student');
  setBtnLoading(btn, true);
  try {
    let permanentId = document.getElementById('f-permanent-id').value.trim();
    if (!permanentId) {
      const year = new Date().getFullYear();
      const { count } = await supabaseClient
        .from('students')
        .select('*', { count: 'exact', head: true })
        .like('permanent_student_id', `${year}%`);
      const serial = String((count || 0) + 1).padStart(3, '0');
      permanentId = `${year}${serial}`;
    }

    const classId = document.getElementById('f-class').value || null;
    const sectionId = document.getElementById('f-section').value || null;

    const { data: student, error } = await supabaseClient.from('students').insert({
      permanent_student_id: permanentId,
      full_name: document.getElementById('f-name').value.trim(),
      date_of_birth: document.getElementById('f-dob').value || null,
      gender: document.getElementById('f-gender').value,
      guardian_contact: document.getElementById('f-guardian-contact').value.trim() || null,
      address: document.getElementById('f-address').value.trim() || null,
      admission_session_id: currentSession ? currentSession.id : null,
    }).select().single();
    if (error) throw error;

    // Seed academic_history for the admission session/class/section, if a class was picked
    if (classId && currentSession) {
      await supabaseClient.from('academic_history').insert({
        student_id: student.id,
        academic_session_id: currentSession.id,
        class_id: classId,
        section_id: sectionId,
      });
    }

    showToast(t('student_added'), 'success');
    closeModal('modal-new-student');
    document.getElementById('form-new-student').reset();
    await loadStudents();
  } catch (err) {
    showToast(err.message || t('error_generic'), 'error');
  } finally {
    setBtnLoading(btn, false);
  }
});

let currentLinkStudentId = null;
let lgSearchTimeout;

async function openLinkGuardian(studentId, studentName) {
  currentLinkStudentId = studentId;
  document.getElementById('lg-student-name').textContent = studentName;
  document.getElementById('lg-search').value = '';
  document.getElementById('lg-relationship').value = '';
  document.getElementById('lg-results').style.display = 'none';
  await renderLinkedGuardians();
  openModal('modal-link-guardian');
}

async function renderLinkedGuardians() {
  const { data } = await supabaseClient
    .from('student_guardians')
    .select('id, relationship, profiles(full_name)')
    .eq('student_id', currentLinkStudentId);
  const list = document.getElementById('lg-linked-list');
  if (!data || !data.length) {
    list.innerHTML = '<p class="hint">এখনও কোনো অভিভাবক লিংক করা হয়নি / No guardians linked yet</p>';
    return;
  }
  list.innerHTML = data.map(l => `
    <div class="row" style="justify-content:space-between; padding:6px 0;">
      <span style="font-size:13.5px;">${l.profiles?.full_name || '—'} ${l.relationship ? '· ' + l.relationship : ''}</span>
      <button class="btn btn-danger" style="padding:4px 9px; font-size:11.5px;" onclick="unlinkGuardian('${l.id}')">Remove</button>
    </div>
  `).join('');
}

async function unlinkGuardian(linkId) {
  const { error } = await supabaseClient.from('student_guardians').delete().eq('id', linkId);
  if (error) { showToast(error.message, 'error'); return; }
  await renderLinkedGuardians();
}

document.getElementById('lg-search').addEventListener('input', (e) => {
  clearTimeout(lgSearchTimeout);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('lg-results').style.display = 'none'; return; }
  lgSearchTimeout = setTimeout(async () => {
    const { data } = await supabaseClient.from('profiles').select('id, full_name').eq('role', 'guardian').ilike('full_name', `%${q}%`).limit(8);
    const box = document.getElementById('lg-results');
    if (!data || !data.length) { box.innerHTML = '<p class="hint" style="padding:8px 12px;">No matching guardian accounts found</p>'; box.style.display = 'block'; return; }
    box.innerHTML = data.map(g => `
      <div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--color-border); font-size:13.5px;" onclick="linkGuardian('${g.id}')">
        ${g.full_name}
      </div>
    `).join('');
    box.style.display = 'block';
  }, 250);
});

async function linkGuardian(guardianProfileId) {
  const relationship = document.getElementById('lg-relationship').value.trim() || null;
  const { error } = await supabaseClient.from('student_guardians').insert({
    student_id: currentLinkStudentId,
    guardian_profile_id: guardianProfileId,
    relationship
  });
  if (error) { showToast(error.message, 'error'); return; }
  showToast('লিংক করা হয়েছে / Linked', 'success');
  document.getElementById('lg-search').value = '';
  document.getElementById('lg-results').style.display = 'none';
  await renderLinkedGuardians();
}

(async () => {
  const profile = await renderShell('students');
  if (!profile) return;
  await loadFormLookups();
  await loadStudents();
})();
</script>
</body>
</html>
