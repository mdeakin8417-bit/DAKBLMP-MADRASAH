<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#0B5B4C">
<title>User Management — DAKBLMP MADRASAH</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.tabs { display:flex; gap:4px; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); overflow-x:auto; }
.tab-btn { padding: 10px 16px; border:none; background:none; font-size:13.5px; font-weight:600; color: var(--color-ink-soft); cursor:pointer; border-bottom: 2.5px solid transparent; white-space:nowrap; }
.tab-btn.active { color: var(--color-green-800); border-bottom-color: var(--color-green-800); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
.user-row { display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); padding: var(--space-4); border:1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-3); background: var(--color-surface); flex-wrap: wrap; }
.user-info { display:flex; align-items:center; gap: 10px; min-width: 180px; }
.user-actions { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
.role-select { padding: 8px 10px; border-radius: var(--radius-sm); border: 1.4px solid var(--color-border); font-size: 13px; }
</style>
</head>
<body data-lang="bn">

<div class="app-shell">
  <div id="shell-sidebar-slot"></div>
  <div class="main">
    <div id="shell-topbar-slot"></div>

    <div class="content">
      <div class="section-head">
        <h2>ব্যবহারকারী পরিচালনা / User Management</h2>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="pending">অনুমোদনের অপেক্ষায় / Pending <span id="pending-count-badge"></span></button>
        <button class="tab-btn" data-tab="approved">অনুমোদিত / Approved</button>
      </div>

      <div class="tab-panel active" id="panel-pending">
        <div id="pending-list"><div class="skeleton" style="height:70px;"></div></div>
        <div id="pending-empty" class="empty-state" hidden>
          <div class="glyph">&#9989;</div>
          <h3>কোনো অনুমোদনের অপেক্ষায় নেই / Nothing pending</h3>
        </div>
      </div>

      <div class="tab-panel" id="panel-approved">
        <div id="approved-list"><div class="skeleton" style="height:70px;"></div></div>
      </div>
    </div>

    <div id="shell-bottomnav-slot"></div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script>
let isFounder = false;
let myId = null;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

const ROLE_LABELS = {
  student: 'ছাত্র / Student',
  guardian: 'অভিভাবক / Guardian',
  teacher: 'শিক্ষক / Teacher',
  committee: 'কমিটি / Committee',
  admin: 'অ্যাডমিন / Admin',
  founder: 'প্রতিষ্ঠাতা / Founder',
};

function roleOptionsHtml(currentRole) {
  const roles = ['student', 'guardian', 'teacher', 'committee'];
  if (isFounder) roles.push('admin');
  return roles.map(r => `<option value="${r}" ${r === currentRole ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('');
}
async function loadUsers() {
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('id, full_name, role, is_approved, created_at')
    .or('role.is.null,role.neq.founder')
    .order('created_at', { ascending: false });

  if (error) { showToast(error.message, 'error'); return; }

  const pending = (data || []).filter(u => !u.is_approved);
  const approved = (data || []).filter(u => u.is_approved);

  document.getElementById('pending-count-badge').textContent = pending.length ? `(${pending.length})` : '';

  const pendingWrap = document.getElementById('pending-list');
  const pendingEmpty = document.getElementById('pending-empty');
  if (!pending.length) {
    pendingWrap.innerHTML = '';
    pendingEmpty.removeAttribute('hidden');
  } else {
    pendingEmpty.setAttribute('hidden', '');
    pendingWrap.innerHTML = pending.map(u => `
      <div class="user-row">
        <div class="user-info">
          <div class="avatar">${initials(u.full_name)}</div>
          <div>
            <div style="font-weight:700; font-size:14px;">${u.full_name}</div>
            <div class="hint">Signed up ${formatDate(u.created_at, getLang())}</div>
          </div>
        </div>
        <div class="user-actions">
          <select class="role-select" id="role-${u.id}">
            <option value="">ভূমিকা বেছে নিন / Choose role</option>
            ${roleOptionsHtml(null)}
          </select>
          <button class="btn btn-primary" style="padding:8px 14px; font-size:12.5px;" onclick="approveUser('${u.id}')">✓ Approve</button>
        </div>
      </div>
    `).join('');
  }

  const approvedWrap = document.getElementById('approved-list');
  if (!approved.length) {
    approvedWrap.innerHTML = '<p class="hint">এখনও কোনো অনুমোদিত ব্যবহারকারী নেই / No approved users yet</p>';
  } else {
    approvedWrap.innerHTML = approved.map(u => `
      <div class="user-row">
        <div class="user-info">
          <div class="avatar">${initials(u.full_name)}</div>
          <div>
            <div style="font-weight:700; font-size:14px;">${u.full_name}</div>
            <div class="hint">${formatDate(u.created_at, getLang())}</div>
          </div>
        </div>
        <div class="user-actions">
          <span class="pill pill-role">${ROLE_LABELS[u.role] || u.role}</span>
          ${u.id !== myId ? `
            <select class="role-select" onchange="changeRole('${u.id}', this.value)">
              <option value="">রোল পরিবর্তন / Change role</option>
              ${roleOptionsHtml(u.role)}
            </select>
          ` : '<span class="hint">(You)</span>'}
        </div>
      </div>
    `).join('');
  }
}

async function approveUser(userId) {
  const role = document.getElementById(`role-${userId}`).value;
  if (!role) { showToast('একটি ভূমিকা নির্বাচন করুন / Select a role first', 'error'); return; }
  const { error } = await supabaseClient.from('profiles').update({ role, is_approved: true }).eq('id', userId);
  if (error) { showToast(error.message, 'error'); return; }
  showToast('অনুমোদিত হয়েছে / Approved', 'success');
  await loadUsers();
}

async function changeRole(userId, newRole) {
  if (!newRole) return;
  const { error } = await supabaseClient.from('profiles').update({ role: newRole }).eq('id', userId);
  if (error) { showToast(error.message, 'error'); return; }
  showToast('হালনাগাদ হয়েছে / Updated', 'success');
  await loadUsers();
}

(async () => {
  const profile = await renderShell('users');
  if (!profile) return;
  if (!['founder', 'admin'].includes(profile.role)) {
    document.querySelector('.content').innerHTML = '<div class="empty-state"><div class="glyph">&#128274;</div><h3>Access restricted</h3></div>';
    return;
  }
  isFounder = profile.role === 'founder';
  myId = profile.id;
  await loadUsers();
})();
</script>
</body>
</html>
